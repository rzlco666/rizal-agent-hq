<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rizal Agent HQ — Markas 3D Agent Rizal</title>
<link rel="icon" href="logo.svg">
<style>
  :root{--bg:#0b1020;--panel:#131a2e;--panel2:#0e1424;--line:#24304d;--txt:#e8edf7;--mut:#93a1bd;
        --green:#3ddc97;--blue:#7c9eff;--yellow:#ffd166;--orange:#ffb454;--red:#ff6b7a;--grey:#5b6b8c}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 system-ui,Segoe UI,sans-serif}
  header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel2);position:sticky;top:0;z-index:30}
  header img{width:34px;height:34px}
  header h1{font-size:17px;margin:0}
  header .mut{color:var(--mut);font-size:12px}
  header .sp{flex:1}
  .badge{background:var(--red);color:#fff;border-radius:99px;padding:1px 9px;font-weight:700;font-size:12px;cursor:pointer}
  .badge.zero{background:#22304f;color:var(--mut)}
  button{background:#1b2745;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:12.5px}
  button:hover{border-color:var(--blue)}
  main{display:grid;grid-template-columns:1fr 350px;gap:0;min-height:calc(100vh - 55px)}
  @media (max-width:980px){main{grid-template-columns:1fr}}
  #stage{position:relative;min-height:520px;background:radial-gradient(1200px 600px at 50% 0%,#16213d,#0b1020)}
  #stage canvas{display:block}
  #stageBar{position:absolute;top:10px;left:10px;display:flex;gap:6px;z-index:5;flex-wrap:wrap}
  #bubbleTip{position:absolute;pointer-events:none;background:#0e1424ee;border:1px solid var(--line);border-radius:10px;padding:8px 10px;max-width:300px;font-size:12.5px;display:none;z-index:6}
  aside{border-left:1px solid var(--line);background:var(--panel2);padding:12px;overflow:auto;max-height:calc(100vh - 55px)}
  @media (max-width:980px){aside{max-height:none;border-left:none}}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:16px 0 8px}
  h2:first-child{margin-top:0}
  .kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .kpi div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
  .kpi b{font-size:16px;display:block}
  .kpi span{color:var(--mut);font-size:11.5px}
  .alertCard{background:#2a1420;border:1px solid var(--red);border-radius:10px;padding:9px 11px;margin:8px 0}
  .alertCard.warn{background:#2a2110;border-color:var(--yellow)}
  .alertCard.act{background:#2a1e10;border-color:var(--orange)}
  .alertCard b{font-size:13px}
  .alertCard .needs{color:var(--mut);font-size:12.5px;margin:3px 0 6px}
  .qrow{margin:7px 0}
  .qrow .top{display:flex;justify-content:space-between;font-size:12.5px}
  .bar{height:7px;background:#1b2745;border-radius:99px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--green)}
  .bar i.hot{background:var(--yellow)} .bar i.full{background:var(--red)}
  .mut{color:var(--mut)} .small{font-size:12px}
  section.below{padding:14px 16px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media (max-width:980px){section.below{grid-template-columns:1fr}}
  .task,.evt{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin:8px 0}
  .pill{border-radius:99px;padding:0 8px;font-size:11.5px;border:1px solid var(--grey);color:var(--mut);white-space:nowrap}
  .pill.bekerja{border-color:var(--green);color:var(--green)} .pill.berpikir{border-color:var(--blue);color:var(--blue)}
  .pill.menunggu-rizal{border-color:var(--orange);color:var(--orange)} .pill.selesai{border-color:var(--green);color:var(--green)}
  .pill.gagal,.pill.error{border-color:var(--red);color:var(--red)} .pill.berjalan{border-color:var(--green);color:var(--green)}
  .steps{margin:6px 0 0;padding-left:18px;color:var(--mut);font-size:12.5px}
  .steps li.done{color:var(--green)}
  /* drawer detail */
  #drawer{position:fixed;top:0;right:-460px;width:440px;max-width:94vw;height:100vh;background:var(--panel2);border-left:1px solid var(--line);z-index:40;transition:right .25s;padding:16px;overflow:auto}
  #drawer.open{right:0}
  #drawer h3{margin:2px 0 4px;font-size:18px}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
  .tabs button.on{border-color:var(--green);color:var(--green)}
  .kv{display:grid;grid-template-columns:110px 1fr;gap:4px 10px;font-size:13px}
  .kv dt{color:var(--mut)} .kv dd{margin:0}
  #grid2d{display:none;padding:14px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
  .card2d{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px;cursor:pointer}
  .card2d:hover{border-color:var(--blue)}
</style>
</head>
<body>
<header>
  <img src="logo.svg" alt="Logo">
  <div>
    <h1>Rizal Agent HQ</h1>
    <div class="mut" id="clock">memuat…</div>
  </div>
  <div class="sp"></div>
  <span class="mut small" id="wsState">menghubungkan…</span>
  <span class="badge zero" id="alertBadge" title="Alert aktif">🚨 0</span>
</header>

<main>
  <div id="stage">
    <div id="stageBar">
      <button data-cam="depan">📷 Depan</button>
      <button data-cam="atas">🛰️ Atas</button>
      <button data-cam="alert">🚨 Fokus Alert</button>
      <button id="btn2d">🗂️ Mode 2D</button>
    </div>
    <div id="bubbleTip"></div>
    <div id="grid2d"></div>
  </div>
  <aside>
    <h2>Ringkasan hari ini</h2>
    <div class="kpi" id="kpi"></div>
    <h2>🚨 Butuh Rizal</h2>
    <div id="alerts"><p class="mut small">Tidak ada alert aktif. Semua aman.</p></div>
    <h2>Kuota provider</h2>
    <div id="quotas"></div>
    <h2>Lingkungan (konteks)</h2>
    <div id="env" class="small"></div>
  </aside>
</main>

<section class="below">
  <div>
    <h2>🧑‍💼 Tugas (manusiawi)</h2>
    <div id="tasks"></div>
  </div>
  <div>
    <h2>📜 Log (manusiawi) <label class="small mut" style="float:right"><input type="checkbox" id="rawToggle"> lihat mentah</label></h2>
    <div id="events"></div>
  </div>
</section>

<div id="drawer">
  <button id="drawerClose" style="float:right">✕ Tutup</button>
  <div id="drawerBody"></div>
</div>

<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
<script type="module" src="app.js"></script>
</body>
</html>
