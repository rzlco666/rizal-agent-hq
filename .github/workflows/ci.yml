name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust · fmt / clippy / test / deny
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install toolchain from rust-toolchain.toml
        uses: dtolnay/rust-toolchain@master

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace

      - name: Build workspace
        run: cargo build --workspace

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Check dependencies
        run: cargo deny check

  parity:
    name: Parity · frozen v2 fixtures
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify oracle checksums and fixture counts
        run: bash tools/parity/verify.sh

  web:
    name: Web · check / test / build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        working-directory: web
        run: corepack pnpm install --frozen-lockfile --ignore-scripts
      - name: Install API generator dependencies
        run: npm ci --prefix tools/gen-api --ignore-scripts

      - name: API schema parity
        run: corepack pnpm -C web api:check

      - name: i18n contract
        run: corepack pnpm -C web check:i18n

      - name: Type check
        run: corepack pnpm -C web check

      - name: Unit tests
        run: corepack pnpm -C web test

      - name: Build
        run: corepack pnpm -C web build

      - name: Bundle budget
        run: corepack pnpm -C web check:bundle

      - name: Build with embedded web assets
        run: cargo build --workspace

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: web/build/
