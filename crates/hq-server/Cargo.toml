[package]
name = "hq-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "rizal-agent-hq"
path = "src/main.rs"

[dependencies]
hq-core = { path = "../hq-core" }
hq-collect = { path = "../hq-collect" }
hq-alert = { path = "../hq-alert" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
axum = { version = "0.8", features = ["ws"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rusqlite = { version = "0.41", features = ["bundled"] }
sha2 = "0.10"
tower-http = { version = "0.7", features = ["fs", "compression-gzip"] }
console-subscriber = { version = "0.5", optional = true }

[features]
# Profiling tokio-console: `cargo build --features console` + HQ_CONSOLE=1 +
# RUSTFLAGS="--cfg tokio_unstable". Bukan bagian service live.
console = ["tokio/tracing", "dep:console-subscriber"]
