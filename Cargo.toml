[workspace]
resolver = "2"
members = ["crates/hq-core", "crates/hq-collect", "crates/hq-alert", "crates/hq-server"]

[workspace.package]
version = "2.0.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[profile.release]
opt-level = 3
lto = true
strip = true
